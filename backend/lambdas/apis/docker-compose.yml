services:
  postgres:
    image: postgres:18
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: ns-scoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d ns-scoring"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
