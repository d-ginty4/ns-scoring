services:
  postgres:
    image: postgres:18
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: ns-scoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d ns-scoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: ns-scoring-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_USER: local
      DB_PASSWORD: local
      DB_NAME: ns-scoring
      DB_PORT: "5432"
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
