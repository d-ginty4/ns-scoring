basePath: /api
definitions:
  models.Athlete:
    properties:
      competition:
        $ref: '#/definitions/models.Competition'
      competitionId:
        type: integer
      country:
        type: string
      createdAt:
        type: string
      deletedAt:
        format: date-time
        type: string
      division:
        $ref: '#/definitions/models.Division'
      divisionId:
        type: integer
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    required:
    - country
    - divisionId
    - name
    type: object
  models.AthleteRequest:
    properties:
      country:
        type: string
      divisionId:
        type: integer
      name:
        type: string
    required:
    - country
    - divisionId
    - name
    type: object
  models.Competition:
    properties:
      country:
        type: string
      createdAt:
        type: string
      deletedAt:
        format: date-time
        type: string
      iconName:
        type: string
      id:
        type: integer
      name:
        type: string
      region:
        $ref: '#/definitions/models.Region'
      regionId:
        type: integer
      updatedAt:
        type: string
    required:
    - country
    - name
    - regionId
    type: object
  models.CompetitionRequest:
    properties:
      country:
        type: string
      iconName:
        type: string
      name:
        type: string
      regionId:
        type: integer
    required:
    - country
    - name
    - regionId
    type: object
  models.Division:
    properties:
      createdAt:
        type: string
      deletedAt:
        format: date-time
        type: string
      gender:
        enum:
        - male
        - female
        type: string
      id:
        type: integer
      name:
        type: string
      updatedAt:
        type: string
    required:
    - gender
    - name
    type: object
  models.DivisionRequest:
    properties:
      gender:
        enum:
        - male
        - female
        type: string
      name:
        type: string
    required:
    - gender
    - name
    type: object
  models.Event:
    properties:
      createdAt:
        type: string
      deletedAt:
        format: date-time
        type: string
      eventNumber:
        type: integer
      id:
        type: integer
      name:
        type: string
      scoringMethod:
        type: string
      updatedAt:
        type: string
      weightOptionsMen:
        items:
          type: integer
        type: array
      weightOptionsWomen:
        items:
          type: integer
        type: array
    required:
    - eventNumber
    - name
    - scoringMethod
    - weightOptionsMen
    - weightOptionsWomen
    type: object
  models.EventRequest:
    properties:
      eventNumber:
        type: integer
      name:
        type: string
      scoringMethod:
        type: string
      weightOptionsMen:
        items:
          type: integer
        type: array
      weightOptionsWomen:
        items:
          type: integer
        type: array
    required:
    - eventNumber
    - name
    - scoringMethod
    - weightOptionsMen
    - weightOptionsWomen
    type: object
  models.Region:
